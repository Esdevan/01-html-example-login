<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Login</title>
    <!-- Vinculación de Google Fonts para la fuente Inter -->
    <link rel="preconnect" href="https://googleapis.com" />
    <link rel="preconnect" href="https://gstatic.com" crossorigin />
    <link
      href="https://googleapis.com/css2?family=Inter:wght@400;600;700&display=swap"
      rel="stylesheet"
    />

    <style>
      body {
        font-family: "Inter", sans-serif;
        padding: 0;
      }

      button,
      input {
        border-width: 1px;
        border-style: solid;
      }

      input {
        padding: 20px;

        border-color: #ebedf0;
        border-radius: 10px;
      }

      button {
        padding: 15px 10px 15px 10px;
        border-radius: 16px;
        border-width: 0;
        background-color: #0064e0;
        color: #fff;
        transition: all;
        cursor: pointer;
      }
      button:hover {
        opacity: 0.8;
      }
      button.btn-transparent {
        background-color: transparent;
        color: #000;
      }
      button.btn-transparent:hover {
        background-color: #ebedf0;
      }
      button.btn-outline {
        border-width: 1px;
        border-style: solid;
        border-color: #0064e0;
        color: #0064e0;
      }
    </style>
  </head>
  <body style="margin: 0 0 0 0">
    <main
      style="
        grid-template-columns: 65% 35%;
        display: grid;
        width: 100%;
        border-bottom: 2px solid #ebedf0;
      "
    >
      <div
        class="image-title"
        style="display: flex; padding: 20px; border-right: 2px solid #ebedf0"
      >
        <div
          class="title"
          style="
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            width: 100%;
            max-width: 270px;
            font-size: 3.75rem;
          "
        >
          <div class="logo" style="width: 50px; height: 50px">
            <svg
              xmlns="http://www.w3.org/2000/svg"
              viewBox="0 0 666.667 666.667"
            >
              <defs>
                <clipPath id="facebook_icon__a" clipPathUnits="userSpaceOnUse">
                  <path d="M0 700h700V0H0Z" />
                </clipPath>
              </defs>
              <g
                clip-path="url(#facebook_icon__a)"
                transform="matrix(1.33333 0 0 -1.33333 -133.333 800)"
              >
                <path
                  d="M0 0c0 138.071-111.929 250-250 250S-500 138.071-500 0c0-117.245 80.715-215.622 189.606-242.638v166.242h-51.552V0h51.552v32.919c0 85.092 38.508 124.532 122.048 124.532 15.838 0 43.167-3.105 54.347-6.211V81.986c-5.901.621-16.149.932-28.882.932-40.993 0-56.832-15.528-56.832-55.9V0h81.659l-14.028-76.396h-67.631v-171.773C-95.927-233.218 0-127.818 0 0"
                  style="
                    fill: #0866ff;
                    fill-opacity: 1;
                    fill-rule: nonzero;
                    stroke: none;
                  "
                  transform="translate(600 350)"
                />
                <path
                  d="m0 0 14.029 76.396H-67.63v27.019c0 40.372 15.838 55.899 56.831 55.899 12.733 0 22.981-.31 28.882-.931v69.253c-11.18 3.106-38.509 6.212-54.347 6.212-83.539 0-122.048-39.441-122.048-124.533V76.396h-51.552V0h51.552v-166.242a250.559 250.559 0 0 1 60.394-7.362c10.254 0 20.358.632 30.288 1.831V0Z"
                  style="
                    fill: #fff;
                    fill-opacity: 1;
                    fill-rule: nonzero;
                    stroke: none;
                  "
                  transform="translate(447.918 273.604)"
                />
              </g>
            </svg>
          </div>
          <span>
            Explora lo que
            <span style="color: #0866ff; font-weight: 600">más te gusta</span>.
          </span>
        </div>

        <div
          class="image"
          style="
            display: flex;
            justify-content: center;
            align-items: center;
            width: 100%;
          "
        >
          <img
            src="./imges/imagen-facebook.webp"
            alt=""
            style="
              max-width: 100%;
              height: auto;
              object-fit: cover;
              display: block;
            "
          />
        </div>
      </div>
      <div
        class="form"
        style="
          display: flex;
          flex-direction: column;
          justify-content: center;
          gap: 24px;
          padding: 40px;
        "
      >
        <span style="font-weight: 600">Iniciar sesión en Facebook</span>
        <input
          id="mail"
          type="text"
          placeholder="Correo electrónico o número de celular"
        />
        <input id="password" type="password" placeholder="Contraseña" />
        <button>Iniciar sesión</button>
        <button class="btn-transparent">¿Olvidaste tu contraseña?</button>
        <button class="btn-transparent btn-outline">
          Crea una nueva cuenta
        </button>
      </div>
    </main>
    <footer style="display: flex; flex-direction: column; align-items: center">
      <ul style="display: flex; list-style: none; padding: 0; gap: 20px">
        <li>Español</li>
        <li>English (US)</li>
        <li>Français (France)</li>
        <li>Português (Brasil)</li>
        <li>Deutsch</li>
        <li>Italiano</li>
        <li>中文(简体)</li>
        <li>Más idiomas…</li>
      </ul>

      <span>All rights reserved.</span>
    </footer>
  </body>
</html>
