<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>

    <style>
      .nav {
        display: flex;
        justify-content: center;
        padding-top: 10px;
        padding-bottom: 10px;
      }

      .form {
        display: flex;
        flex-direction: column;
        justify-content: center;
        align-items: center;
        gap: 20px;
      }

      input,
      button {
        padding: 15px;
        border-style: solid;
        border-radius: 10px;
        width: 200px;
      }
      input {
        border-width: 0.5px;
      }
      button {
        border-width: 0;
      }

      .btn {
        cursor: pointer;
        transition: all 0.4s ease;
      }
      .btn:hover {
        opacity: 0.8;
      }
      .btn-primary {
        background-color: blue;
        color: white;
      }
      .btn-outline-primary {
        background: transparent;
        border-color: blue;
        border-width: 1px;
      }

      .btn-outline-primary:hover {
        background: rgb(204, 202, 202);
      }
    </style>
  </head>
  <body>
    <header class="nav">
      <h1>Facebook</h1>
    </header>
    <main>
      <div class="form">
        <input
          id="form-control-mail"
          type="text"
          placeholder="Ingresa tu correo"
        />
        <input
          id="form-control-password"
          type="password"
          placeholder="Ingresa tu contraseña"
        />
        <button class="btn btn-primary">Ingresar</button>
        <button class="btn btn-outline-primary">Crear Cuenta</button>
        <a href="#">¿Olvidaste tu contraseña?</a>
      </div>
    </main>
    <footer>All rigths reserved!!!</footer>
  </body>
</html>
